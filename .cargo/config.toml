# Build and test parallelism for this machine: 24 cores, 19 given to cargo so
# the box stays usable and so a runaway job cannot starve everything else.
[build]
jobs = 19

# `cargo test` still defaults to one thread per core for the test harness
# itself; pass --test-threads=19 (see xtask / the test script) to hold the same
# ceiling there.
[term]
quiet = false

# The C runtime, linked statically.
#
# `SPEC_CS.md` section 22 asks for a single executable that can simply be copied
# to another machine. With the default dynamic linkage the binary imports
# `vcruntime140.dll`, which is present on most Windows installs and guaranteed on
# none - so "copy it and it runs" would have been true on this machine and
# untrue on a fresh one, which is the worst kind of portability claim.
#
# Verified by reading the import table before and after: the name is gone.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
