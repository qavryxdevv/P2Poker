# D-074: the release is built where anybody can see it being built, and GitHub signs what it built.
#
# A tag `v*` (or a manual run) builds the Windows client on a GitHub-hosted runner from exactly the tagged commit,
# writes its SHA-256 beside it, and asks GitHub for a **build provenance attestation**: a statement, signed through
# Sigstore with a certificate that exists for minutes and is bound to THIS workflow in THIS repository at THIS commit,
# that the file with that digest came out of this run. Nobody holds a signing key -- there is none to steal -- and
# the statement goes into a public transparency log.
#
# Anybody can then check a download against the source it claims to be:
#
#     gh attestation verify p2p-poker.exe --repo qavryxdevv/P2Poker
#
# What it proves: this file is what this repository's workflow built from that commit. What it does NOT prove: that
# the source is good -- read it -- and it is not a Windows code-signing certificate, so SmartScreen still asks.
#
# Every action is pinned to a commit, not to a tag: a tag can be moved, and a moved tag in a signing workflow is a
# way to sign somebody else's build under this repository's name. Only GitHub's own actions are used.
#
# D-078: and the Linux client, from the same commit on a Linux runner -- an AppImage, a .deb, an .rpm and a .tar.gz,
# attested the same way (`gh attestation verify <file> --repo qavryxdevv/P2Poker`). The two builds run side by side;
# the release is published by a third job once both are done, so a release never holds one system's files alone.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # VS 2022 and its v143 toolset, which is where tools/build-tox.ps1 and build.rs expect libsodium to be built.
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write          # to ask Sigstore for the short-lived certificate
      attestations: write      # to store the attestation
      artifact-metadata: write # what actions/attest asks for beside it
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      attestation: ${{ steps.attest.outputs.attestation-url }}
    env:
      # .cargo/config.toml holds the owner's machine to 19 jobs; a hosted runner has four cores and 16 GB.
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version the client will say it is
        # D-075's version check compares the About page's number with the release tags, so a release whose tag and
        # binary disagree would make that button lie.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$version") { throw "the tag ${{ github.ref_name }} is not v$version, which is what Cargo.toml and the About page say" }
          "tag and Cargo.toml agree: $version"

      - name: Rust, stable, as the runner ships it
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: libsodium, static, from the vendored source
        shell: pwsh
        run: ./tools/build-tox.ps1

      - name: Name nothing of the machine it is built on
        # S1-EN: rustc writes every dependency's source path into the binary, and build.rs refuses a release
        # build until those paths are mapped away. The first run of this workflow stopped exactly there -- the
        # project's own guard, working on a machine that is not the owner's. The same script the owner runs.
        shell: pwsh
        run: ./tools/remap-build-paths.ps1

      - name: Build the client (release, locked to Cargo.lock)
        shell: pwsh
        run: cargo build --release --locked

      - name: And it does not
        # Read from the built file, not from the flags: the runner's profile, user, computer name and
        # checkout path must not be in it, as the owner's are not in his.
        shell: pwsh
        run: ./tools/check-build-paths.ps1

      - name: It starts, and says which version it is
        shell: pwsh
        run: |
          # `--cash` is refused (D-072) before a window or the node is started, so this shows that the file runs
          # and says its version, in a second, on a machine with no display. It makes a throwaway profile beside
          # the binary on the way, which the runner throws away with the rest. Through `cmd` so that a line on
          # stderr is a line and not a PowerShell error; the refusal's exit code 2 is the one expected.
          # Backslashes, because to `cmd` a forward slash begins a switch.
          $out = cmd /c 'target\release\p2p-poker.exe --cash 2>&1' | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 2) { throw "expected the refusal's exit code 2, got $LASTEXITCODE" }
          if ($out -notmatch 'p2p-poker [0-9]+[.][0-9]+[.][0-9]+') { throw 'the client did not say its version' }
          $global:LASTEXITCODE = 0

      # The Authenticode signature, before the hash and the attestation so that everything the release page says is
      # of the signed file. All three steps do nothing until SIGNPATH_ORGANIZATION_ID is set on the repository --
      # the SignPath Foundation has the application and has not answered yet -- so a release, a dry run and a fork
      # build exactly as they did, unsigned. The gate is on the variable rather than on the secret because a step's
      # `if` cannot read `secrets`. docs/CODE_SIGNING.md is the policy the Foundation asks a project to publish.
      - name: Hand the unsigned binary to the signing service
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2p-poker-unsigned
          if-no-files-found: error
          path: target/release/p2p-poker.exe

      - name: Authenticode signature (SignPath Foundation, free for open source)
        # The key never reaches this runner: SignPath fetches the artifact of this run through its GitHub app, a
        # person approves the request, and the signed file comes back into target/release in place of it. The three
        # slugs are SignPath's own names for the project, the artifact and the signing policy, and are set as
        # repository variables when the project is created there.
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/release

      - name: And the file carries it
        # A signature nobody reads back is a signature that can stop happening quietly. This fails the build on a
        # file that is unsigned, broken, or signed by somebody else.
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature 'target/release/p2p-poker.exe'
          Write-Host "$($s.Status): $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "the signature is $($s.Status)" }
          if ($s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw 'signed by somebody else' }

      - name: SHA-256, as other tools print it
        id: digest
        shell: pwsh
        run: |
          $exe = 'target/release/p2p-poker.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  p2p-poker.exe" | Out-File -Encoding ascii -NoNewline 'target/release/p2p-poker.exe.sha256'
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "### p2p-poker.exe`n`n``$hash```n`n$((Get-Item $exe).Length) bytes, built from ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY

      - name: Attest the build's provenance
        id: attest
        # Free plans attest public repositories only. While this one was private the step is skipped and the
        # release says so, rather than the whole workflow going red for a reason that is not a fault.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/p2p-poker.exe

      - name: Keep the attestation beside the file, for checking offline
        if: ${{ steps.attest.outputs.bundle-path != '' }}
        shell: pwsh
        run: Copy-Item '${{ steps.attest.outputs.bundle-path }}' 'target/release/p2p-poker.exe.sigstore.json'

      - name: Keep the build with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2p-poker-windows-x64
          if-no-files-found: error
          path: |
            target/release/p2p-poker.exe
            target/release/p2p-poker.exe.sha256
            target/release/p2p-poker.exe.sigstore.json

      # D-080: the package for the Microsoft Store, made from the very binary above and left with the run for the
      # owner to submit in Partner Center. Unsigned on purpose: the Store signs it after certification, which is what
      # spares a player the SmartScreen warning. It is not a release asset -- an unsigned MSIX installs for nobody --
      # and it is not made at all until the three identity values of the Store account are set on the repository.
      - name: The Microsoft Store's package
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        run: |
          ./tools/package-msix.ps1 `
            -IdentityName '${{ vars.MSIX_IDENTITY_NAME }}' `
            -Publisher '${{ vars.MSIX_PUBLISHER }}' `
            -PublisherDisplayName '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}'

      - name: Keep the Store's package with the run
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2p-poker-msix
          if-no-files-found: error
          path: dist/*.msix

  linux:
    # D-078: built against glibc 2.35, so the program runs on Ubuntu 22.04, Debian 12, Fedora 36 and every
    # distribution after them.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write          # to ask Sigstore for the short-lived certificate
      attestations: write      # to store the attestation
      artifact-metadata: write # what actions/attest asks for beside it
    outputs:
      attestation: ${{ steps.attest.outputs.attestation-url }}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version the client will say it is
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "the tag ${{ github.ref_name }} is not v$version, which is what Cargo.toml and the About page say"
            exit 1
          fi
          echo "tag and Cargo.toml agree: $version"

      - name: Rust, stable, as the runner ships it
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: The tools the packages are made with
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf automake libtool rpm

      - name: libsodium, static, from the vendored source
        run: sh tools/build-sodium.sh

      - name: Build the client (release, locked to Cargo.lock), naming nothing of the machine
        # S1-EN on Linux: what tools/remap-build-paths.ps1 writes into the cargo home on Windows, given here --
        # the runner's home, the cargo and rustup homes and the checkout, most general first, because rustc takes
        # the last flag that matches -- and the same maps for the C a build script compiles, through CFLAGS.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/p2p-poker"
          export CFLAGS="-ffile-prefix-map=$HOME=~ -ffile-prefix-map=$GITHUB_WORKSPACE=/p2p-poker"
          cargo build --release --locked

      - name: And it does not
        shell: pwsh
        run: ./tools/check-build-paths.ps1

      - name: It starts, and says which version it is
        # As on Windows: `--cash` is refused (D-072) before a window or the node is started.
        run: |
          set +e
          out=$(./target/release/p2p-poker --cash 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then echo "expected the refusal's exit code 2, got $code"; exit 1; fi
          echo "$out" | grep -Eq 'p2p-poker [0-9]+[.][0-9]+[.][0-9]+' || { echo 'the client did not say its version'; exit 1; }

      - name: It confines its own writes, and the helper it opens things through does not (D-082)
        # Landlock on the runner's kernel: a write in the profile goes through and one in the home folder is refused
        # (exit 0; 3 would be a kernel that confines nothing, 1 anything else). The helper, started before the
        # confinement, is asked to open the profile's folder -- a stand-in for the desktop's xdg-open writes a file
        # where the client may not, which only a helper that kept its rights can.
        run: |
          mkdir -p "$RUNNER_TEMP/sbx/bin"
          printf '%s\n' '#!/bin/sh' 'echo "$1" > "$HOME/.p2poker-opener-probe"' > "$RUNNER_TEMP/sbx/bin/xdg-open"
          chmod +x "$RUNNER_TEMP/sbx/bin/xdg-open"
          rm -f "$HOME/.p2poker-opener-probe"
          set +e
          PATH="$RUNNER_TEMP/sbx/bin:$PATH" ./target/release/p2p-poker --sandbox-check --profile "$RUNNER_TEMP/sbx/profile"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then echo "--sandbox-check exited $code"; exit 1; fi
          for i in 1 2 3 4 5; do [ -f "$HOME/.p2poker-opener-probe" ] && break; sleep 1; done
          test -f "$HOME/.p2poker-opener-probe" || { echo 'the helper did not open the folder'; exit 1; }
          echo "the helper opened: $(cat "$HOME/.p2poker-opener-probe")"
          rm -f "$HOME/.p2poker-opener-probe"

      - name: The packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sh tools/package-linux.sh "$version"
          cd dist
          sha256sum * > SHA256SUMS-linux.txt
          { echo '### Linux'; echo; echo '```'; cat SHA256SUMS-linux.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The .deb installs, keeps its profile in the data folder, and its window opens (Xvfb, Mesa's OpenGL)
        # D-078: installed as a player installs it, with apt resolving what the package asks for -- the first run
        # of this step found the runner without libxkbcommon-x11, which the window loads at run time and the .deb
        # names. The installed program keeps its profile in ~/.local/share/p2poker and none in /usr/bin. Then the
        # table preview (no node, no network): a window that cannot open returns at once, so one still alive after
        # twenty seconds opened, and the screen's average colour says whether anything was drawn -- the felt is green.
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb x11-apps imagemagick libgl1-mesa-dri
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sudo apt-get install -y -q "./dist/p2poker_${version}_amd64.deb"
          rm -rf "$HOME/.local/share/p2poker"
          set +e
          /usr/bin/p2p-poker --cash > /dev/null 2>&1
          set -e
          if [ ! -d "$HOME/.local/share/p2poker/profile" ]; then echo "the installed program kept no profile in ~/.local/share/p2poker"; exit 1; fi
          if [ -e /usr/bin/profile ]; then echo "the installed program made a profile beside itself"; exit 1; fi
          echo "profile: ~/.local/share/p2poker/profile"
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          /usr/bin/p2p-poker --table-preview &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"
            echo "the window closed by itself, exit $?: it did not open"
            exit 1
          fi
          xwd -root -silent | convert xwd:- -resize 1x1 txt:- | tail -n 1
          kill "$pid"

      - name: A software centre lists the installed package, so it can be removed where it was found (S1-JA)
        # GNOME Software and KDE Discover list the components the system's AppStream knows, not the packages dpkg
        # installed: the .deb of 0.1.4 carried no metainfo, and neither of them showed the program it had installed.
        run: |
          sudo apt-get install -y -q --no-install-recommends appstream
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sh tools/check-linux-listing.sh "dist/p2poker-${version}-1.x86_64.rpm"

      - name: Its sounds are heard, through ALSA, by a sound server (PulseAudio, a sink with no speaker, recorded)
        # D-079: the sounds and the search music go to ALSA's default device, which on a desktop is its sound server
        # behind ALSA's own plugin for it. A runner has no speaker: PulseAudio is started with a sink that plays to
        # nothing, ALSA's default device is pointed at it, and what reaches the sink is recorded and read, in 10 ms
        # windows, a window heard when a sample in it is over 300. Of the fifteen sounds 11.7 s are heard so: at least
        # 9 s of them must be, before the line that says the music starts, and at least 2 s of the music's 3 s and fade
        # after it; the client must have waited for the device, not run ahead of it, which would cost it seconds of
        # processor time.
        run: |
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils libasound2-plugins
          if [ ! -d "${XDG_RUNTIME_DIR:-/nonexistent}" ]; then
            export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
            mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          fi
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cap
          pactl set-default-sink cap
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > "$HOME/.asoundrc"
          python3 - <<'EOF'
          import array, resource, signal, subprocess, time
          raw = "/tmp/p2poker-sound.raw"
          rec = subprocess.Popen(["parecord", "--raw", "--latency-msec=50", "--format=s16le", "--rate=44100",
                                  "--channels=2", "--device=cap.monitor", raw])
          time.sleep(1)
          start = time.monotonic()
          client = subprocess.Popen(["/usr/bin/p2p-poker", "--sound-check"], stdout=subprocess.PIPE, text=True)
          marks = []
          for line in client.stdout:
              print(line, end="", flush=True)
              marks.append((time.monotonic() - start, line))
          if client.wait() != 0:
              raise SystemExit("--sound-check failed")
          used = resource.getrusage(resource.RUSAGE_CHILDREN)
          cpu = used.ru_utime + used.ru_stime
          time.sleep(1)
          rec.send_signal(signal.SIGINT)
          rec.wait(timeout=10)
          data = open(raw, "rb").read()
          samples = array.array("h")
          samples.frombytes(data[: len(data) // 4 * 4])
          loud = [max(max(w), -min(w)) for w in (samples[at : at + 882] for at in range(0, len(samples) - 881, 882))]
          heard = [x > 300 for x in loud]
          if True not in heard:
              raise SystemExit("nothing was heard")
          # The recording's clock is set by the first sound, heard when the client's first line says it starts.
          first = heard.index(True)
          music_line = next(t for t, line in marks if "search music" in line)
          def window(t):
              return max(0, first + round((t - marks[0][0]) * 100))
          sounds = sum(heard[: window(music_line)]) / 100
          music = sum(heard[window(music_line + 0.4) : window(music_line + 4.0)]) / 100
          print("recorded %.1f s; heard: the sounds %.2f s, the music %.2f s, in all %.2f s; peak %d;"
                " the client's processor time %.2f s" % (len(loud) / 100, sounds, music, sum(heard) / 100, max(loud), cpu))
          if sounds < 9 or music < 2 or sum(heard) > 2400:
              raise SystemExit("the sounds and the music were not heard as they are")
          if cpu > 2.5:
              raise SystemExit("the client did not wait for the device")
          EOF
          rm -f "$HOME/.asoundrc"
          pulseaudio --kill

      - name: Attest the build's provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

      - name: Keep the attestation beside the files, for checking offline
        if: ${{ steps.attest.outputs.bundle-path != '' }}
        run: cp '${{ steps.attest.outputs.bundle-path }}' dist/p2poker-linux.sigstore.json

      - name: Keep the build with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2p-poker-linux-x64
          if-no-files-found: error
          path: dist/*

  release:
    # Published once both systems are built: a release never holds one system's files alone.
    needs: [windows, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # to publish the release
    steps:
      - name: The two builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $files = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          $windowsAttested = if ('${{ needs.windows.outputs.attestation }}') { "Windows: ${{ needs.windows.outputs.attestation }}" } else { 'Windows: not attested (the repository was private when this was built).' }
          $linuxAttested = if ('${{ needs.linux.outputs.attestation }}') { "Linux: ${{ needs.linux.outputs.attestation }}" } else { 'Linux: not attested (the repository was private when this was built).' }
          $fence = '```'
          $size = [math]::Round((Get-Item 'dist/p2p-poker.exe').Length / 1MB)
          $base = 'https://github.com/${{ github.repository }}'
          $get = "$base/releases/download/$tag"
          $notes = @(
            '## Download',
            '',
            "**[p2p-poker.exe]($get/p2p-poker.exe)** - Windows x64, one portable file, $size MB.",
            '',
            'Start it and it offers to install itself: a copy in your user folder, a shortcut on the desktop and in the Start menu, no administrator rights, nothing in the registry. Decline, and it runs from the folder it is in.',
            '',
            'A beta. Play money only. It is not signed with a Windows certificate, so SmartScreen asks before the first start (*More info*, then *Run anyway*).',
            '',
            '**Linux** (x86_64, glibc 2.35 or newer: Ubuntu 22.04, Debian 12, Fedora 36 and later):',
            '',
            "- **[P2Poker-$version-x86_64.AppImage]($get/P2Poker-$version-x86_64.AppImage)** - one file for any distribution: make it executable and start it.",
            "- **[p2poker_$($version)_amd64.deb]($get/p2poker_$($version)_amd64.deb)** - Ubuntu, Debian, Mint, Pop!_OS: ``sudo apt install ./p2poker_$($version)_amd64.deb``",
            "- **[p2poker-$version-1.x86_64.rpm]($get/p2poker-$version-1.x86_64.rpm)** - Fedora, openSUSE: ``sudo dnf install ./p2poker-$version-1.x86_64.rpm``",
            "- **[P2Poker-$version-linux-x86_64.tar.gz]($get/P2Poker-$version-linux-x86_64.tar.gz)** - the program in a folder, to run from where it is unpacked.",
            '',
            'On Linux the player profile is kept in `~/.local/share/p2poker/profile` (a `profile` folder beside the program makes a portable copy instead).',
            '',
            '## This build is verified',
            '',
            'GitHub built these files on its own machines from exactly this tag, and **signed a statement that it did** (a build provenance attestation, through Sigstore). That is already done - nothing is pending.',
            '',
            'SHA-256 of `p2p-poker.exe`:',
            '`${{ needs.windows.outputs.sha256 }}`',
            '',
            'The Linux files are listed with theirs in `SHA256SUMS-linux.txt`.',
            '',
            'Anyone who wants to check a file for themselves can, with GitHub''s own tool:',
            '',
            $fence,
            'gh attestation verify p2p-poker.exe --repo ${{ github.repository }}',
            $fence,
            '',
            "It answers that the file was built by this repository's release.yml from refs/tags/$tag, and it refuses any other file. $windowsAttested $linuxAttested"
          ) -join "`n"
          $notes | Out-File -Encoding utf8 'release-notes.md'
          # A full release, marked latest: the owner's word, 2026-09-20. A pre-release is never what GitHub calls
          # the latest, so the repository's front page showed no release and its files sat folded away; that the
          # client is a beta is said in the title and on its own About page, not by hiding the download.
          #
          # D-080, once the Store carries this client: the release is created as a DRAFT and published by hand when
          # the Store has published the same version. The client asks GitHub which version is newest and closes the
          # lobby when it is behind (D-077), and a copy from the Store cannot do anything about that until Microsoft
          # has certified the new one -- so a release made public first locks those players out for as long as the
          # queue takes. A draft is nobody's release (src/app/update.rs), so while it waits, everybody keeps playing
          # the version they have. The variable is set only when there is a Store listing to wait for.
          $arguments = @('--verify-tag')
          if ('${{ vars.RELEASE_WAITS_FOR_STORE }}' -ne '') { $arguments += '--draft' } else { $arguments += '--latest' }
          gh release create $tag @files --repo '${{ github.repository }}' --title "P2Poker $version beta" --notes-file 'release-notes.md' @arguments
          if ('${{ vars.RELEASE_WAITS_FOR_STORE }}' -ne '') {
              @(
                "### $tag is a draft",
                '',
                "It waits for the Microsoft Store to publish $version. Until it does, nobody is asked to update and nobody is locked out of a game.",
                '',
                'Publish it once the Store has that version:',
                '',
                $fence,
                "gh release edit $tag --draft=false --latest",
                $fence
              ) -join "`n" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          }
