[package]
name = "p2p-poker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Decentralised No-Limit Texas Hold'em over libp2p and BitTorrent Mainline DHT"
# No `repository`, `authors` or `homepage`. The crate is `publish = false`, so
# none of them reaches a registry, and each is a place for somebody's name to
# end up in a file that gets copied about. Set `repository` if this is ever
# published.
publish = false

# ---------------------------------------------------------------------------
# Phase 0 integration check.
#
# Every version below comes from a research document that verified it in
# isolation, by compiling. Nobody had yet verified they COEXIST - and the
# arkworks, dalek and rand ecosystems are exactly where that breaks. This
# manifest exists to answer that question before any code is written on top.
# ---------------------------------------------------------------------------

[dependencies]

# --- network transport: docs/research/LIBP2P.md ---------------------------
libp2p = { version = "0.56.0", features = [
    "tokio", "macros",
    "quic", "tcp", "noise", "tls", "yamux", "dns",
    "gossipsub", "kad", "identify", "ping", "autonat", "dcutr", "relay", "mdns",
    "request-response", "cbor",
    "upnp", "metrics", "memory-connection-limits",
    "ed25519",
    # RSA identities, which this project uses for nothing and needs anyway.
    # The public entry points onto the libp2p network still have `Qm...` peer
    # ids - multihashes of RSA public keys, from before Ed25519 was the default -
    # and without this feature their TLS certificate cannot be verified. It fails
    # as `invalid peer certificate: UnknownIssuer`, which reads like a broken
    # certificate rather than a key type this build cannot parse. Measured
    # against `/dnsaddr/bootstrap.libp2p.io`.
    "rsa",
    "serde",
] }
libp2p-stream = "0.4.0-alpha"
# Only so this crate can implement `libp2p::request_response::Codec`, whose
# trait is `#[async_trait]`. Already in the graph via that crate; this makes the
# edge direct rather than adding anything to build.
async-trait = "0.1"

# --- mental poker: docs/research/MENTAL_POKER.md --------------------------
ziffle = "=0.1.0"
# The serialisation ziffle delegates to. A direct edge because the wire
# boundary - not the library - decides compressed-and-validated over the
# unchecked path (ZIFFLE_VERDICT.md C-1). Already in the tree through ziffle,
# so this adds nothing to the lockfile.
ark-serialize = { version = "=0.5.0", default-features = false }

# --- cryptography: docs/research/CRYPTO_LIBS.md ---------------------------
ed25519-dalek    = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "rand_core"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "digest"] }
sha2      = { version = "0.11.0", default-features = false, features = ["alloc"] }
blake3    = { version = "1.8.7",  default-features = false, features = ["std"] }
rand_core = { version = "0.10.1", default-features = false }
getrandom = { version = "0.4.3",  default-features = false, features = ["std", "sys_rng"] }
zeroize   = { version = "1.9.0",  default-features = false, features = ["alloc", "derive"] }
subtle    = { version = "2.6.1",  default-features = false }
minicbor  = { version = "2.3.0",  default-features = false, features = ["std", "derive"] }
argon2           = { version = "0.6.0",  default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }

# --- poker rules: docs/research/POKER_RULES.md ---------------------------
# 7-card evaluator, behind our own facade. Pinned exactly: 5.1.0 does not build
# on stable rustc 1.95.0 (POKER_RULES.md A2, a verified negative result).
rs_poker = { version = "=5.0.0", default-features = false }

# --- gui: docs/research/GUI_STACK.md --------------------------------------
eframe      = { version = "0.36.1", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts"] }
egui_extras = { version = "0.36.1", features = ["image"] }
rust-embed  = "8.12.0"
image       = { version = "0.25.10", default-features = false, features = ["png"] }

# --- runtime --------------------------------------------------------------
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures = "0.3"
# Present only because libp2p-autonat needs rand_core 0.6's OsRng. Our own
# code must never draw cryptographic randomness from it - spec section 7
# forbids SmallRng and self-seeded generators. See CRYPTO_LIBS.md section 1.2.
rand = "0.8"
crab_nat = "0.8"
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
# The second renderer, and the reason the client starts on a machine with no
# graphics driver. Only the Direct3D 12 backend is compiled: it is the one that
# can reach WARP, the software rasteriser every Windows 10 already carries.
# Named here rather than left to eframe because eframe's `wgpu` feature turns on
# all of wgpu's backends, which is several megabytes we would never call.
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl", "dx12"] }

# --- dev-only: the arkworks types the vendored ziffle is built on --------
# Present so tests/deck_constants.rs (ZIFFLE_VERDICT.md C-7) can recompute
# ziffle's two nothing-up-my-sleeve constants independently of ziffle, whose
# `open_deck` and Pedersen key are `pub(crate)` with no accessor. Versions are
# ziffle's own, so this adds no crate to the lockfile and nothing to the
# shipped binary. `rand 0.8` for `StdRng` is already a normal dependency.
[dev-dependencies]
ark-ec        = { version = "=0.5.0", default-features = false }
ark-ff        = { version = "=0.5.0", default-features = false }
ark-secp256k1 = { version = "=0.5.0", default-features = false }
ark-serialize = { version = "=0.5.0", default-features = false }
ark-std       = { version = "=0.5.0", default-features = false }

# ---------------------------------------------------------------------------
# Vendored ziffle - ZIFFLE_VERDICT.md condition C-0.
#
# The bytes reviewed by the ziffle review are in the tree, so the review has a
# frozen artefact to be a review *of*, and an upstream yank or repository
# deletion cannot take the deck out from under us.
#
# vendor/ziffle/ was the unmodified crates.io 0.1.0 tarball and is now FORKED
# under condition C-12 - the 32/64-bit transcript split, the reveal token that
# bound one ciphertext coordinate, and a const guard that never fired. Proofs
# made here do not verify upstream and upstream's do not verify here, which is
# intended. vendor/ziffle/PROVENANCE.md records the digest, the upstream git
# sha, the licence choice and every change.
# ---------------------------------------------------------------------------
[patch.crates-io]
ziffle = { path = "vendor/ziffle" }

# ---------------------------------------------------------------------------
# Build profiles, sized for how this project is actually worked on.
# ---------------------------------------------------------------------------
#
# The dev profile exists here only for `cargo clippy`. Every test in this
# project runs in release - the cryptography is unusably slow otherwise, and the
# random-hand harness plays ~120 000 hands - so nothing ever attaches a debugger
# to a dev build.
#
# Full debug information for a dependency tree this size costs about 15 GB, all
# of it for a debugger nobody runs. `line-tables-only` keeps what a panic
# backtrace needs, which is the one thing that information is used for here.
[profile.dev]
debug = "line-tables-only"

# The release profile carries none, for the same reason plus one more: the
# shipped binary is the portable single file of SPEC_CS.md section 22, and
# debug information is weight a player downloads and never uses.
[profile.release]
debug = false
strip = "debuginfo"

# --- build-time resources -------------------------------------------------
# Only to put the icon inside the executable on Windows. See build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Compiling the vendored c-toxcore. Only under `--features tox`, but cargo
# resolves build-dependencies unconditionally, so it is declared here rather
# than made optional: `cc` is small, has no transitive tree worth the name, and
# an optional build-dependency would buy nothing but a longer manifest.
[build-dependencies]
cc = "1"

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
#
# **`tox` changes this project's licence.** `c-toxcore` is GPL-3.0, not LGPL,
# and linking it makes the whole client GPL-3.0 - D-019 takes that decision
# deliberately and calls it a one-way door. It is a feature rather than an
# unconditional dependency so that the line where the licence changes is a line
# somebody can see, and so that the tree still builds for anyone without a C
# toolchain.
#
# It is NOT in `default`. Turning it on also requires `tools/build-tox.ps1` to
# have built libsodium once.
[features]
default = []
tox = ["dep:attohttpc", "dep:serde_json"]

# --- only under `--features tox` -------------------------------------------
#
# The Tox node list has to update itself: a list baked into a binary goes stale
# and takes the relay fallback down with it, and the relay fallback is what
# makes a NAT survivable. So the client fetches `https://nodes.tox.chat/json`,
# which is what every Tox client does.
#
# `attohttpc` is already in the tree - `igd-next` pulls it in for UPnP - but
# without TLS, so this turns its rustls feature on rather than adding a client.
# `rustls` itself is already here for libp2p. `serde_json` is new and is one
# crate for one document.
[dependencies.attohttpc]
version = "0.30"
optional = true
default-features = false
# **`tls-native`, and not rustls, after trying rustls twice.**
#
# `tls-rustls` takes rustls's *default* provider, which is `aws-lc-rs`, while
# libp2p already brings `ring`. Two providers in one graph and rustls refuses to
# choose: it panics at the first request with "could not automatically determine
# the process-level CryptoProvider" - a runtime failure from a feature choice.
#
# `tls-rustls-webpki-roots-ring` looks like the fix and is broken upstream in
# 0.30.1: it sets `rustls/ring` but not `__rustls`, and `src/tls/mod.rs` gates
# the whole implementation on `__rustls`, so the build succeeds with TLS
# compiled out and every request answers "TLS is disabled".
#
# `tls-native` is schannel on Windows - no second crypto library, the OS trust
# store, nothing to choose - and this client's shipped binary is Windows.
# On Linux it is OpenSSL, which is a build dependency worth knowing about
# before that target is taken seriously.
features = ["tls-native", "compress"]

[dependencies.serde_json]
version = "1"
optional = true
